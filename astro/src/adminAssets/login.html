<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Consulta RUC Perú</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
  }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
  input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    margin-bottom: 1rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #e2e8f0;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #1e40af; }
  .error {
    background: #7f1d1d;
    color: #fecaca;
    padding: 0.6rem;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Panel de Administración</h1>
    <div class="error" id="errorBox">Usuario o contraseña incorrectos.</div>
    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        window.location.href = '/admin/dashboard';
      } else {
        document.getElementById('errorBox').style.display = 'block';
      }
    });
  </script>
</body>
</html>
