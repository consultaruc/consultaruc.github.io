<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acceso — Panel de Consulta RUC Perú</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Consola de operación, no el sitio público: mismos colores de marca
     (navy, azul #2563EB, naranja #F97316) pero en un registro más oscuro,
     para que se note al instante que esto es "la trastienda". Sin webfonts:
     este HTML se sirve tal cual desde disco, sin pipeline de assets. */
  :root {
    --ink:      #0B1120;
    --panel:    #131C2E;
    --panel-2:  #0F1829;
    --line:     #23304A;
    --line-soft:#1B2438;
    --text:     #E8EEF9;
    --muted:    #8496B3;
    --brand:    #2563EB;
    --brand-lt: #5B8DEF;
    --amber:    #F97316;
    --bad:      #F87171;
    --bad-bg:   #2A1215;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
    /* Un halo muy tenue detrás de la tarjeta: da profundidad sin decorar. */
    background-image: radial-gradient(60rem 30rem at 50% -10%, rgba(37,99,235,.10), transparent 70%);
  }

  .shell { width: 100%; max-width: 380px; }

  .brand {
    display: flex; align-items: center; gap: .65rem;
    justify-content: center; margin-bottom: 1.4rem;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, #3B6FE0, var(--brand));
    display: grid; place-items: center;
    box-shadow: 0 6px 18px -8px rgba(37,99,235,.9);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-text strong {
    display: block; font-size: .95rem; letter-spacing: -.01em; line-height: 1.2;
  }
  .brand-text span {
    font-family: var(--mono); font-size: .66rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.75rem 1.6rem 1.6rem;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 48px -24px rgba(0,0,0,.9);
  }

  h1 {
    font-size: 1.05rem; font-weight: 650; letter-spacing: -.015em;
    margin-bottom: .3rem;
  }
  .sub { font-size: .82rem; color: var(--muted); margin-bottom: 1.35rem; }

  /* El error se anuncia (role=alert) además de mostrarse: quien use lector de
     pantalla se entera igual. Oculto por defecto vía [hidden]. */
  .error {
    display: flex; align-items: flex-start; gap: .55rem;
    background: var(--bad-bg);
    border: 1px solid rgba(248,113,113,.32);
    color: #FCA5A5;
    padding: .6rem .7rem;
    border-radius: 9px;
    font-size: .82rem;
    margin-bottom: 1rem;
    line-height: 1.4;
  }
  .error[hidden] { display: none; }
  .error svg { width: 15px; height: 15px; flex: none; margin-top: .1rem; }

  .field { margin-bottom: .9rem; }
  label {
    display: block; font-size: .72rem; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); margin-bottom: .4rem;
  }
  input {
    width: 100%;
    padding: .62rem .75rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-size: .93rem;
    font-family: var(--sans);
    transition: border-color .14s, box-shadow .14s;
  }
  input::placeholder { color: #4E5F7C; }
  input:focus {
    outline: none;
    border-color: var(--brand-lt);
    box-shadow: 0 0 0 3px rgba(37,99,235,.22);
  }

  button {
    width: 100%;
    margin-top: .35rem;
    padding: .7rem;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: .92rem;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: background .14s, opacity .14s;
  }
  button:hover:not(:disabled) { background: #1D4ED8; }
  button:focus-visible { outline: 2px solid var(--brand-lt); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: progress; }

  .foot {
    margin-top: 1.1rem; text-align: center;
    font-family: var(--mono); font-size: .68rem; letter-spacing: .06em;
    color: #4E5F7C;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="2"></rect>
          <circle cx="12" cy="12" r="2.5"></circle>
          <path d="M7 12h.01M17 12h.01"></path>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Consulta RUC Perú</strong>
        <span>Panel interno</span>
      </span>
    </div>

    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="sub">Área restringida. Sólo personal autorizado.</p>

      <div class="error" id="errorBox" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path>
        </svg>
        <span id="errorText">Usuario o contraseña incorrectos.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submitBtn">Ingresar</button>
      </form>
    </div>

    <p class="foot">consultaruc-pe.com</p>
  </div>

  <script>
    (function () {
      var form   = document.getElementById('loginForm');
      var btn    = document.getElementById('submitBtn');
      var errBox = document.getElementById('errorBox');
      var errTxt = document.getElementById('errorText');
      var user   = document.getElementById('username');
      var pass   = document.getElementById('password');

      function showError(msg) {
        errTxt.textContent = msg;
        errBox.hidden = false;
      }
      // Que el error desaparezca al corregir evita el estado confuso de ver
      // "incorrectos" mientras ya se está escribiendo algo distinto.
      [user, pass].forEach(function (el) {
        el.addEventListener('input', function () { errBox.hidden = true; });
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!user.value || !pass.value) {
          showError('Completa usuario y contraseña.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Comprobando…';
        errBox.hidden = true;

        try {
          var res = await fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.value, password: pass.value })
          });

          if (res.ok) {
            btn.textContent = 'Entrando…';
            window.location.href = '/admin/dashboard';
            return;
          }
          // 429 llega del loginLimiter (5 intentos fallidos / 15 min). Decirlo
          // explícitamente evita que parezca que la contraseña cambió sola.
          if (res.status === 429) {
            showError('Demasiados intentos fallidos. Espera unos minutos antes de reintentar.');
          } else {
            showError('Usuario o contraseña incorrectos.');
          }
        } catch (err) {
          showError('No se pudo conectar con el servidor. Revisa la conexión.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
          pass.select();
        }
      });
    })();
  </script>
</body>
</html>
